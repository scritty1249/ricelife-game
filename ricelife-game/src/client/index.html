<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
        <link rel="stylesheet" href="./stylesheets/styles.css"/>
        <link rel="stylesheet" href="./stylesheets/loader.css"/>
        <script>
            Object.defineProperty(window, "__VERSION", {
                value: "<!-- GIT_COMMIT_SHA -->",
                writable: false,
                configurable: false,
                enumerable: true
            });
            Object.defineProperty(window, "__WEB_WORKER_PATH", {
                value: "<!-- GENERATED_WORKER_URL -->",
                writable: false,
                configurable: false,
                enumerable: true
            });
        </script>
        <script>
            (function checkCanvasBlurSupport() {
                if (typeof window === "undefined") return;

                let blurSupported = false;
                const canvas = document.createElement("canvas");
                const ctx = canvas?.getContext?.("2d");
                if (ctx && ("filter" in ctx)) {
                    try {
                        canvas.width = 2;
                        canvas.height = 1;
                        ctx.filter = "blur(1px)";
                        ctx.fillStyle = "#000000";
                        ctx.fillRect(0, 0, 1, 1);
                        const pixelData = ctx.getImageData(1, 0, 1, 1).data;
                        blurSupported = pixelData[0] > 0
                            || pixelData[1] > 0
                            || pixelData[2] > 0
                            || pixelData[3] > 0;
                    } catch (e) {
                        blurSupported = false;
                    } finally {
                        canvas.width = 0;
                        canvas.height = 0;
                    }
                }
                Object.defineProperty(window, "__CANVAS_BLUR_SUPPORTED", {
                    value: blurSupported,
                    writable: false,
                    configurable: false,
                    enumerable: true
                });
            })();
        </script>
        <!-- SCRIPT_BUNDLE_TAG -->
    </head>
    <body>
        <canvas id="app"></canvas>
        <div id="loading-screen" class="loader">
            <span class="spinner"></span>
            <div id="loading-caption" class="caption">Loading</div>
        </div>
    </body>
</html>
